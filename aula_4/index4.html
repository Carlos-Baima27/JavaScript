<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-dark text-light">
    <div class="container">
      <div class="row">
        <div class="col-4">
          <label for="cep" class="form-label">CEP</label>
          <div class="input-group mb-3">
            <input type="text" name="cep" id="cep" />
            <button type="button" class="btn btn-primary" onclick="buscarCep()">
              Buscar
            </button>
          </div>
        </div>

        <div class="col-4">
          <label for="logradouro" class="form-label">Logradouro</label>
          <input
            type="text"
            name="logradouro"
            id="logradouro"
            class="form-control"
          />
        </div>
        <div class="col-4">
          <label for="bairro" class="form-label">Bairro</label>
          <input type="text" name="bairro" id="bairro" class="form-control" />
        </div>
        <div class="col-4">
          <label for="complemento" class="form-label">Complemento</label>
          <input
            type="text"
            name="complemento"
            id="complemento"
            class="form-control"
          />
        </div>
        <div class="col-4">
          <label for="cidade" class="form-label">Cidade</label>
          <input type="text" name="cidade" id="cidade" class="form-control" />
        </div>

        <div class="col-4">
          <label for="uf" class="form-label">UF</label>
          <input type="text" name="uf" id="uf" class="form-control" />
        </div>
        <div class="col-4">
          <label for="região" class="form-label">Região</label>
          <input type="text" name="região" id="região" class="form-control" />
        </div>
        <div class="col-4">
          <label for="ddd" class="form-label">DDD</label>
          <input type="text" name="ddd" id="ddd" class="form-control" />
        </div>
        <div class="col-4">
          <label for="ibge" class="form-label">IBGE</label>
          <input type="text" name="ibge" id="ibge" class="form-control" />
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="index4.js"></script>
  </body>
</html>
